<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Millionaire Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary-glow: rgba(139, 92, 246, 0.6); /* Purple */
            --secondary-glow: rgba(59, 130, 246, 0.6); /* Blue */
            --correct-glow: rgba(34, 197, 94, 0.8); /* Green */
            --incorrect-glow: rgba(239, 68, 68, 0.8); /* Red */
            --locked-glow: rgba(234, 179, 8, 0.8); /* Yellow */
        }
        
        body {
            background-color: #020617; /* Deep slate/navy */
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .bg-spotlight {
            background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #020617 70%);
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(139, 92, 246, 0.3);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .btn-option {
            background: linear-gradient(90deg, rgba(30,27,75,1) 0%, rgba(49,46,129,1) 50%, rgba(30,27,75,1) 100%);
            border: 2px solid #6d28d9;
            box-shadow: 0 0 10px var(--primary-glow);
            transition: all 0.3s ease;
            position: relative;
            clip-path: polygon(5% 0, 95% 0, 100% 50%, 95% 100%, 5% 100%, 0 50%);
        }

        .btn-option:hover:not(:disabled) {
            transform: scale(1.02);
            border-color: #8b5cf6;
            box-shadow: 0 0 20px var(--primary-glow), inset 0 0 10px var(--primary-glow);
            cursor: pointer;
        }

        .btn-option.locked {
            background: linear-gradient(90deg, rgba(113,63,18,1) 0%, rgba(161,98,7,1) 50%, rgba(113,63,18,1) 100%);
            border-color: #eab308;
            box-shadow: 0 0 20px var(--locked-glow);
            animation: pulse-yellow 0.5s infinite alternate;
        }

        .btn-option.correct {
            background: linear-gradient(90deg, rgba(20,83,45,1) 0%, rgba(22,163,74,1) 50%, rgba(20,83,45,1) 100%);
            border-color: #22c55e;
            box-shadow: 0 0 30px var(--correct-glow);
            animation: pulse-green 0.5s infinite alternate;
        }

        .btn-option.incorrect {
            background: linear-gradient(90deg, rgba(127,29,29,1) 0%, rgba(220,38,38,1) 50%, rgba(127,29,29,1) 100%);
            border-color: #ef4444;
            box-shadow: 0 0 30px var(--incorrect-glow);
        }

        .ladder-step {
            transition: all 0.3s ease;
        }
        .ladder-step.active {
            color: #fbbf24; /* Gold */
            font-weight: bold;
            text-shadow: 0 0 10px #fbbf24;
            background: rgba(251, 191, 36, 0.2);
            border-radius: 4px;
        }
        .ladder-step.passed {
            color: #22c55e;
        }

        .lifeline-btn {
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: 2px solid #8b5cf6;
            background: #1e1b4b;
            box-shadow: 0 0 10px var(--primary-glow);
            transition: all 0.2s;
        }
        .lifeline-btn:hover:not(:disabled) {
            transform: scale(1.1);
            background: #4c1d95;
            cursor: pointer;
        }
        .lifeline-btn:disabled {
            opacity: 0.3;
            filter: grayscale(100%);
            cursor: not-allowed;
        }

        @keyframes pulse-yellow {
            from { box-shadow: 0 0 10px var(--locked-glow); }
            to { box-shadow: 0 0 30px var(--locked-glow); }
        }
        @keyframes pulse-green {
            from { box-shadow: 0 0 15px var(--correct-glow); }
            to { box-shadow: 0 0 40px var(--correct-glow); }
        }

        .hidden-screen { display: none !important; }
        
        /* Modal Background */
        .modal-bg {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body class="bg-spotlight h-screen w-screen flex flex-col items-center justify-center relative select-none">

    
    <!-- START SCREEN -->
    <div id="start-screen" class="flex flex-col items-center justify-center w-full h-full z-10 p-4">
        <h1 class="text-6xl font-bold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-blue-400 drop-shadow-[0_0_15px_rgba(139,92,246,0.8)] text-center">
            CLASSROOM MILLIONAIRE
        </h1>
        <h2 class="text-2xl text-blue-200 mb-12 tracking-widest uppercase">Mathematics KSSM Form 4</h2>
        
        <div class="glass-panel p-8 rounded-xl w-full max-w-md flex flex-col gap-4">
            <div>
                <label class="block text-sm text-purple-300 mb-1">Team 1 Name:</label>
                <input type="text" id="team1-input" value="Team Alpha" class="w-full bg-slate-900 border border-purple-500 rounded p-2 text-white focus:outline-none focus:ring-2 focus:ring-purple-400">
            </div>
            <div>
                <label class="block text-sm text-purple-300 mb-1">Team 2 Name (Optional):</label>
                <input type="text" id="team2-input" value="Team Beta" class="w-full bg-slate-900 border border-purple-500 rounded p-2 text-white focus:outline-none focus:ring-2 focus:ring-purple-400">
            </div>
            
            <button onclick="startGame()" class="mt-4 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 text-white font-bold py-3 px-6 rounded shadow-[0_0_15px_rgba(139,92,246,0.6)] transition-all">
                START GAME
            </button>
            <button onclick="toggleDashboard()" class="text-sm text-gray-400 hover:text-white transition-colors underline text-center mt-2">
                Teacher Dashboard
            </button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="hidden-screen w-full h-full flex flex-col lg:flex-row z-10">
        
        <!-- Main Game Area -->
        <div class="flex-grow flex flex-col justify-between p-4 lg:p-8 relative">
            
            <!-- Header -->
            <div class="flex justify-between items-center w-full">
                <div class="glass-panel px-6 py-2 rounded-full text-xl font-bold flex gap-4">
                    <span id="turn-indicator" class="text-purple-300">Turn: Team Alpha</span>
                    <span class="text-gray-500">|</span>
                    <span id="score-indicator" class="text-yellow-400">Score: $0</span>
                </div>
                <button onclick="toggleMute()" id="mute-btn" class="glass-panel px-4 py-2 rounded-full hover:bg-slate-800 transition">
                    🔊 Audio ON
                </button>
            </div>

            <!-- Question Area -->
            <div class="flex flex-col items-center w-full max-w-5xl mx-auto mt-8 mb-auto">
                <div class="w-full glass-panel border-2 border-blue-500 rounded-full py-8 px-12 text-center shadow-[0_0_30px_rgba(59,130,246,0.3)] mb-8 relative">
                    <div class="absolute -top-4 left-1/2 transform -translate-x-1/2 bg-blue-900 text-blue-200 px-4 py-1 rounded-full text-sm font-bold border border-blue-400">
                        QUESTION <span id="q-number">1</span>
                    </div>
                    <h2 id="question-text" class="text-3xl md:text-4xl font-bold text-white leading-tight">
                        Question goes here?
                    </h2>
                </div>

                <!-- Options Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">
                    <button id="opt-0" onclick="selectOption(0)" class="btn-option text-xl md:text-2xl py-6 px-12 text-left flex items-center">
                        <span class="text-purple-400 font-bold mr-4">A:</span> <span id="opt-text-0" class="flex-grow">Option A</span>
                    </button>
                    <button id="opt-1" onclick="selectOption(1)" class="btn-option text-xl md:text-2xl py-6 px-12 text-left flex items-center">
                        <span class="text-purple-400 font-bold mr-4">B:</span> <span id="opt-text-1" class="flex-grow">Option B</span>
                    </button>
                    <button id="opt-2" onclick="selectOption(2)" class="btn-option text-xl md:text-2xl py-6 px-12 text-left flex items-center">
                        <span class="text-purple-400 font-bold mr-4">C:</span> <span id="opt-text-2" class="flex-grow">Option C</span>
                    </button>
                    <button id="opt-3" onclick="selectOption(3)" class="btn-option text-xl md:text-2xl py-6 px-12 text-left flex items-center">
                        <span class="text-purple-400 font-bold mr-4">D:</span> <span id="opt-text-3" class="flex-grow">Option D</span>
                    </button>
                </div>
            </div>

            <!-- Bottom Area (Lifelines & Hint) -->
            <div class="flex justify-between items-end w-full mt-8 h-24">
                <div class="flex gap-4">
                    <button id="ll-5050" onclick="use5050()" class="lifeline-btn" title="50:50">50:50</button>
                    <button id="ll-class" onclick="useAskClass()" class="lifeline-btn" title="Ask the Class">👥</button>
                    <button id="ll-teacher" onclick="useAskTeacher()" class="lifeline-btn" title="Ask Teacher">👨‍🏫</button>
                    <button id="ll-skip" onclick="useSkip()" class="lifeline-btn" title="Skip Question">⏭</button>
                </div>
                
                <div id="hint-panel" class="hidden glass-panel px-6 py-3 rounded-lg border-yellow-500 text-yellow-200 max-w-xl text-right animate-pulse">
                    Hint text here
                </div>

                <button id="next-btn" onclick="nextTurn()" class="hidden bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-full shadow-[0_0_15px_rgba(59,130,246,0.6)]">
                    NEXT ➡
                </button>
            </div>
        </div>

        <!-- Sidebar / Reward Ladder -->
        <div class="lg:w-64 w-full glass-panel border-l-2 border-purple-500 flex flex-col p-4 overflow-y-auto lg:h-full max-h-48 lg:max-h-full">
            <h3 class="text-center text-purple-300 font-bold mb-4 uppercase tracking-widest text-sm">Reward Ladder</h3>
            <div id="ladder-container" class="flex flex-col-reverse gap-1 text-right font-mono text-lg">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>


    <!-- TEACHER DASHBOARD MODAL -->
    <div id="dashboard-modal" class="hidden-screen fixed inset-0 modal-bg z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border-2 border-purple-500 rounded-xl w-full max-w-4xl max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center p-4 border-b border-purple-500/30">
                <h2 class="text-2xl font-bold text-purple-300">Teacher Dashboard</h2>
                <button onclick="toggleDashboard()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div class="p-4 overflow-y-auto flex-grow text-sm">
                <p class="mb-4 text-gray-300">Question Bank (Preview Only):</p>
                <div id="dashboard-q-list" class="flex flex-col gap-2"></div>
            </div>
        </div>
    </div>

    <!-- ASK THE CLASS MODAL -->
    <div id="poll-modal" class="hidden-screen fixed inset-0 modal-bg z-50 flex items-center justify-center p-4">
        <div class="glass-panel border-2 border-blue-500 rounded-xl w-full max-w-md p-6 text-center">
            <h2 class="text-2xl font-bold text-blue-300 mb-6">Class Vote Results</h2>
            <div class="flex items-end justify-center gap-4 h-48 mb-4 border-b border-gray-600 pb-2">
                <!-- Bars -->
                <div class="flex flex-col items-center w-12"><div id="bar-A" class="w-full bg-blue-500 rounded-t transition-all duration-1000" style="height: 0%"></div><span class="mt-2 font-bold">A</span><span id="pct-A" class="text-xs">0%</span></div>
                <div class="flex flex-col items-center w-12"><div id="bar-B" class="w-full bg-blue-500 rounded-t transition-all duration-1000" style="height: 0%"></div><span class="mt-2 font-bold">B</span><span id="pct-B" class="text-xs">0%</span></div>
                <div class="flex flex-col items-center w-12"><div id="bar-C" class="w-full bg-blue-500 rounded-t transition-all duration-1000" style="height: 0%"></div><span class="mt-2 font-bold">C</span><span id="pct-C" class="text-xs">0%</span></div>
                <div class="flex flex-col items-center w-12"><div id="bar-D" class="w-full bg-blue-500 rounded-t transition-all duration-1000" style="height: 0%"></div><span class="mt-2 font-bold">D</span><span id="pct-D" class="text-xs">0%</span></div>
            </div>
            <button onclick="closePoll()" class="mt-4 bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded font-bold text-white">Close</button>
        </div>
    </div>

    <script>
        // --- DATA: QUESTION BANK ---
        const rawQuestions = [
            { q: "Apakah nilai $101_2$ dalam asas 10? / What is the value of $101_2$ in base 10?", opts: ["3", "4", "5", "6"], ans: "5", hint: "1(2^2) + 0(2^1) + 1(2^0) = 4 + 0 + 1 = 5" },
            { q: "Antara berikut, yang manakah ungkapan kuadratik? / Which of the following is a quadratic expression?", opts: ["x³ + 1", "x² + 2x + 1", "1/x + x", "x + 2"], ans: "x² + 2x + 1", hint: "Kuasa tertinggi pemboleh ubah ialah 2. / Highest power is 2." },
            { q: "Jika A ∩ B = ∅, apakah maksudnya? / If A ∩ B = ∅, what does it mean?", opts: ["Set sama / Equal sets", "Set saling eksklusif / Mutually exclusive", "Subset", "Set semesta / Universal set"], ans: "Set saling eksklusif / Mutually exclusive", hint: "Tiada persilangan. / No intersection." },
            { q: "Yang manakah merupakan suatu pernyataan? / Which of the following is a statement?", opts: ["x + 2 = 5", "Tolong duduk. / Please sit down.", "3 > 5", "Berapakah umur anda? / How old are you?"], ans: "3 > 5", hint: "Pernyataan boleh ditentukan benar atau palsu (3 > 5 adalah palsu). / A statement can be determined as true or false." },
            { q: "Apakah jumlah darjah bagi suatu graf dengan E tepi? / What is the sum of degrees for a graph with E edges?", opts: ["E", "2E", "E/2", "E²"], ans: "2E", hint: "Setiap tepi menyambungkan dua bucu. / Each edge connects two vertices." },
            { q: "Tukar 27₁₀ kepada asas 5. / Convert 27₁₀ to base 5.", opts: ["102₅", "120₅", "201₅", "210₅"], ans: "102₅", hint: "27 ÷ 5 = 5 baki 2. 5 ÷ 5 = 1 baki 0. 1 ÷ 5 = 0 baki 1." },
            { q: "Diberi n(ξ)=20, n(A)=10, n(B)=5, A dan B saling eksklusif. Cari n(A ∪ B)'.", opts: ["5", "10", "15", "20"], ans: "5", hint: "20 - (10 + 5) = 5" },
            { q: "Antara berikut, yang manakah merupakan sukatan serakan? / Which of the following is a measure of dispersion?", opts: ["Min / Mean", "Median", "Mod / Mode", "Varians / Variance"], ans: "Varians / Variance", hint: "Ia mengukur sebaran data daripada min. / It measures the spread of data." },
            { q: "Apakah rumus faedah mudah? / What is the formula for simple interest?", opts: ["I = Prt", "I = P(1+r)ᵗ", "I = P/rt", "I = rt/P"], ans: "I = Prt", hint: "Principal × rate × time." },
            { q: "Cari punca-punca bagi persamaan x² - 16 = 0.", opts: ["4 sahaja / 4 only", "-4 sahaja / -4 only", "4 dan -4 / 4 and -4", "16 dan -16"], ans: "4 dan -4 / 4 and -4", hint: "Guna pemfaktoran: (x - 4)(x + 4) = 0" },
            { q: "Dua syiling adil dilambung. Apakah kebarangkalian mendapat dua kepala?", opts: ["1/2", "1/4", "3/4", "1/8"], ans: "1/4", hint: "Kesudahan: (H,H), (H,T), (T,H), (T,T). Hanya 1 kejadian (H,H)." },
            { q: "Kecerunan graf jarak-masa mewakili apa? / The gradient of a distance-time graph represents what?", opts: ["Jarak / Distance", "Masa / Time", "Laju / Speed", "Pecutan / Acceleration"], ans: "Laju / Speed", hint: "Perubahan jarak / perubahan masa = Laju." },
            { q: "Titik (0,0) memuaskan ketaksamaan yang mana? / Point (0,0) satisfies which inequality?", opts: ["y > x + 1", "y < x - 1", "y < x + 1", "y > x"], ans: "y < x + 1", hint: "Gantikan x=0, y=0: 0 < 0 + 1 adalah Benar." },
            { q: "Apakah akas bagi implikasi 'Jika x = 2, maka x² = 4'?", opts: ["Jika x² = 4, maka x = 2.", "Jika x ≠ 2, maka x² ≠ 4.", "Jika x² ≠ 4, maka x ≠ 2.", "x = 2 jika dan hanya jika x² = 4."], ans: "Jika x² = 4, maka x = 2.", hint: "Akas menukar hipotesis dan kesimpulan. / Swap hypothesis and conclusion." },
            { q: "Sebuah pokok (tree) dengan v bucu mempunyai berapa tepi?", opts: ["v", "v+1", "v-1", "2v"], ans: "v-1", hint: "Sifat asas pokok dalam teori graf." },
            { q: "Hubungan sisihan piawai dengan varians ialah... / The relationship of standard deviation to variance is...", opts: ["Kuasa dua / Square", "Punca kuasa dua / Square root", "Darab dua / Multiply by two", "Separuh / Half"], ans: "Punca kuasa dua / Square root", hint: "Sisihan piawai (σ) = √Varians (σ²)" },
            { q: "Apakah maksud ROI dalam pengurusan kewangan?", opts: ["Return on Income", "Rate of Interest", "Return on Investment", "Ratio of Investment"], ans: "Return on Investment", hint: "Pulangan atas pelaburan." },
            { q: "Apakah persamaan paksi simetri bagi fungsi kuadratik f(x) = ax² + bx + c?", opts: ["x = -b/a", "x = -b/2a", "x = b/2a", "x = c/a"], ans: "x = -b/2a", hint: "Rumus titik verteks kuadratik." },
            { q: "Dua dadu dilambung. Apakah kebarangkalian mendapat hasil tambah 12?", opts: ["1/12", "1/36", "1/6", "1/18"], ans: "1/36", hint: "Hanya (6,6) daripada 36 kemungkinan kesudahan." },
            { q: "Luas di bawah graf laju-masa mewakili apa? / The area under a speed-time graph represents what?", opts: ["Laju / Speed", "Jarak / Distance", "Pecutan / Acceleration", "Masa / Time"], ans: "Jarak / Distance", hint: "Laju didarab dengan masa menghasilkan jarak." }
        ];

        const rewards = ["$100", "$200", "$300", "$500", "$1,000", "$2,000", "$4,000", "$8,000", "$16,000", "$32,000", 
                         "$64,000", "$125,000", "$250,000", "$500,000", "$750,000", "$1,000,000", "$2M", "$3M", "$5M", "$10M"];

        // --- STATE VARIABLES ---
        let currentQuestionIndex = 0;
        let teams = [];
        let currentTeamIndex = 0;
        let scores = [0, 0];
        let state = "idle"; // idle, locked, revealed
        let questions = []; // Shuffled/mapped options
        let lifelines = {
            "ll-5050": true,
            "ll-class": true,
            "ll-teacher": true,
            "ll-skip": true
        };
        let isMuted = false;

        // --- AUDIO ENGINE (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let backgroundOsc = null;
        let backgroundGain = null;

        function playTone(freq, type, duration, vol=0.1, slideTo=null) {
            if (isMuted) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            if (slideTo) {
                osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
            }
            
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const SFX = {
            lock: () => playTone(800, 'triangle', 0.5, 0.2),
            correct: () => {
                if(isMuted) return;
                const now = audioCtx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.1, now + (i*0.1));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (i*0.1) + 1);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + (i*0.1)); osc.stop(now + (i*0.1) + 1);
                });
            },
            wrong: () => playTone(150, 'sawtooth', 1.5, 0.3, 50),
            milestone: () => SFX.correct(), // Simple reuse for now
            startBg: () => {
                if (isMuted || backgroundOsc) return;
                backgroundOsc = audioCtx.createOscillator();
                backgroundGain = audioCtx.createGain();
                
                backgroundOsc.type = 'sine';
                backgroundOsc.frequency.value = 100;
                
                // Add LFO for suspense throb
                const lfo = audioCtx.createOscillator();
                lfo.type = 'sine';
                lfo.frequency.value = 2; // 2Hz heartbeat
                const lfoGain = audioCtx.createGain();
                lfoGain.gain.value = 10;
                lfo.connect(lfoGain);
                lfoGain.connect(backgroundOsc.frequency);
                lfo.start();
                
                backgroundGain.gain.value = 0.05;
                backgroundOsc.connect(backgroundGain);
                backgroundGain.connect(audioCtx.destination);
                backgroundOsc.start();
            },
            stopBg: () => {
                if (backgroundOsc) {
                    backgroundOsc.stop();
                    backgroundOsc = null;
                }
            }
        };

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('mute-btn').innerText = isMuted ? "🔇 Audio OFF" : "🔊 Audio ON";
            if (isMuted) SFX.stopBg();
            else if (state !== "idle" && currentQuestionIndex < questions.length) SFX.startBg();
        }

        // --- GAME LOGIC ---

        function initializeQuestions() {
            // Keep order but randomize options
            questions = rawQuestions.map(q => {
                let options = [...q.opts];
                // Simple shuffle
                for (let i = options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [options[i], options[j]] = [options[j], options[i]];
                }
                return {
                    ...q,
                    shuffledOpts: options,
                    correctIndex: options.indexOf(q.ans)
                };
            });
            buildLadder();
        }

        function buildLadder() {
            const container = document.getElementById('ladder-container');
            container.innerHTML = '';
            for (let i = 0; i < rewards.length; i++) {
                const el = document.createElement('div');
                el.className = 'ladder-step px-2 py-1';
                el.id = `ladder-${i}`;
                el.innerHTML = `<span class="text-xs text-gray-500 mr-2">${i+1}</span> ${rewards[i]}`;
                container.appendChild(el);
            }
        }

        function updateLadderUI() {
            for (let i = 0; i < rewards.length; i++) {
                const el = document.getElementById(`ladder-${i}`);
                el.className = 'ladder-step px-2 py-1'; // reset
                if (i < currentQuestionIndex) el.classList.add('passed');
                if (i === currentQuestionIndex) el.classList.add('active');
            }
        }

        function startGame() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const t1 = document.getElementById('team1-input').value || "Team 1";
            const t2 = document.getElementById('team2-input').value.trim();
            teams = t2 ? [t1, t2] : [t1];
            currentTeamIndex = 0;
            scores = [0, 0];
            currentQuestionIndex = 0;
            
            // Reset lifelines
            Object.keys(lifelines).forEach(k => {
                lifelines[k] = true;
                document.getElementById(k).disabled = false;
            });
            
            initializeQuestions();
            
            document.getElementById('start-screen').classList.add('hidden-screen');
            document.getElementById('game-screen').classList.remove('hidden-screen');
            
            SFX.startBg();
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                endGame();
                return;
            }

            state = "idle";
            const q = questions[currentQuestionIndex];
            
            document.getElementById('q-number').innerText = currentQuestionIndex + 1;
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('hint-panel').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            
            updateLadderUI();
            
            document.getElementById('turn-indicator').innerText = `Turn: ${teams[currentTeamIndex]}`;
            document.getElementById('score-indicator').innerText = `Score: ${rewards[Math.max(0, currentQuestionIndex-1)] || '$0'}`;
            
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`opt-${i}`);
                btn.className = 'btn-option text-xl md:text-2xl py-6 px-12 text-left flex items-center';
                btn.disabled = false;
                btn.style.visibility = 'visible';
                document.getElementById(`opt-text-${i}`).innerText = q.shuffledOpts[i];
            }
        }

        function selectOption(idx) {
            if (state !== "idle") return;
            state = "locked";
            
            SFX.lock();
            const btn = document.getElementById(`opt-${idx}`);
            btn.classList.add('locked');
            
            // Disable all buttons
            for(let i=0; i<4; i++) document.getElementById(`opt-${i}`).disabled = true;
            
            // Disable lifelines during lock
            document.querySelectorAll('.lifeline-btn').forEach(b => b.style.pointerEvents = 'none');

            // Wait 2 seconds for reveal
            setTimeout(() => {
                revealAnswer(idx);
            }, 2000);
        }

        function revealAnswer(selectedIndex) {
            state = "revealed";
            const q = questions[currentQuestionIndex];
            const isCorrect = selectedIndex === q.correctIndex;
            
            const selectedBtn = document.getElementById(`opt-${selectedIndex}`);
            const correctBtn = document.getElementById(`opt-${q.correctIndex}`);
            
            selectedBtn.classList.remove('locked');
            
            if (isCorrect) {
                SFX.correct();
                selectedBtn.classList.add('correct');
            } else {
                SFX.wrong();
                selectedBtn.classList.add('incorrect');
                correctBtn.classList.add('correct'); // Show correct answer
            }
            
            // Show explanation
            const hintPanel = document.getElementById('hint-panel');
            hintPanel.innerText = q.hint;
            hintPanel.classList.remove('hidden');
            
            document.getElementById('next-btn').classList.remove('hidden');
            document.querySelectorAll('.lifeline-btn').forEach(b => b.style.pointerEvents = 'auto');
        }

        function nextTurn() {
            const q = questions[currentQuestionIndex];
            const selectedBtn = document.querySelector('.btn-option.correct'); // If they got it right, or wrong (both reveal correct)
            // Wait, we need to know if they actually got it right to advance the ladder.
            // A simpler way: we just advance the question regardless in this classroom version, 
            // but normally a wrong answer ends the game. Let's make it forgiving for classroom: just advance to next team/question.
            
            currentQuestionIndex++;
            currentTeamIndex = (currentTeamIndex + 1) % teams.length;
            loadQuestion();
        }

        function endGame() {
            SFX.stopBg();
            SFX.milestone();
            document.getElementById('game-screen').innerHTML = `
                <div class="w-full h-full flex flex-col items-center justify-center">
                    <h1 class="text-6xl text-yellow-400 font-bold mb-8 shadow-yellow-500 drop-shadow-lg">GAME OVER!</h1>
                    <p class="text-2xl text-white">All questions completed.</p>
                    <button onclick="location.reload()" class="mt-8 bg-blue-600 hover:bg-blue-500 px-8 py-4 rounded-full font-bold shadow-lg">PLAY AGAIN</button>
                </div>
            `;
        }

        // --- LIFELINES ---
        function use5050() {
            if(!lifelines["ll-5050"] || state !== "idle") return;
            lifelines["ll-5050"] = false;
            document.getElementById('ll-5050').disabled = true;
            
            const q = questions[currentQuestionIndex];
            let wrongIndices = [0,1,2,3].filter(i => i !== q.correctIndex);
            // hide 2 random wrong options
            wrongIndices.sort(() => Math.random() - 0.5);
            document.getElementById(`opt-${wrongIndices[0]}`).style.visibility = 'hidden';
            document.getElementById(`opt-${wrongIndices[1]}`).style.visibility = 'hidden';
            playTone(600, 'square', 0.2);
        }

        function useAskTeacher() {
            if(!lifelines["ll-teacher"] || state !== "idle") return;
            lifelines["ll-teacher"] = false;
            document.getElementById('ll-teacher').disabled = true;
            
            const hintPanel = document.getElementById('hint-panel');
            hintPanel.innerText = "Teacher's Hint: " + questions[currentQuestionIndex].hint;
            hintPanel.classList.remove('hidden');
            playTone(700, 'square', 0.2);
        }

        function useSkip() {
            if(!lifelines["ll-skip"] || state !== "idle") return;
            lifelines["ll-skip"] = false;
            document.getElementById('ll-skip').disabled = true;
            playTone(400, 'sine', 0.5, 0.1, 800);
            nextTurn(); // simply skips the turn
        }

        function useAskClass() {
            if(!lifelines["ll-class"] || state !== "idle") return;
            lifelines["ll-class"] = false;
            document.getElementById('ll-class').disabled = true;
            
            document.getElementById('poll-modal').classList.remove('hidden-screen');
            playTone(500, 'triangle', 1.0);
            
            const q = questions[currentQuestionIndex];
            // Fake logic: correct answer gets highest %, others get random
            let percentages = [0,0,0,0];
            percentages[q.correctIndex] = Math.floor(Math.random() * 30) + 40; // 40-70%
            let remaining = 100 - percentages[q.correctIndex];
            
            let wrongIndices = [0,1,2,3].filter(i => i !== q.correctIndex);
            percentages[wrongIndices[0]] = Math.floor(Math.random() * remaining);
            remaining -= percentages[wrongIndices[0]];
            percentages[wrongIndices[1]] = Math.floor(Math.random() * remaining);
            percentages[wrongIndices[2]] = remaining - percentages[wrongIndices[1]];

            // Animate bars
            setTimeout(() => {
                ['A', 'B', 'C', 'D'].forEach((letter, idx) => {
                    document.getElementById(`bar-${letter}`).style.height = `${percentages[idx]}%`;
                    document.getElementById(`pct-${letter}`).innerText = `${percentages[idx]}%`;
                });
            }, 100);
        }

        function closePoll() {
            document.getElementById('poll-modal').classList.add('hidden-screen');
        }

        // --- DASHBOARD ---
        function toggleDashboard() {
            const modal = document.getElementById('dashboard-modal');
            if(modal.classList.contains('hidden-screen')) {
                modal.classList.remove('hidden-screen');
                populateDashboard();
            } else {
                modal.classList.add('hidden-screen');
            }
        }

        function populateDashboard() {
            const list = document.getElementById('dashboard-q-list');
            list.innerHTML = '';
            rawQuestions.forEach((q, i) => {
                list.innerHTML += `
                    <div class="bg-slate-800 p-3 rounded border border-slate-700">
                        <strong class="text-blue-300">Q${i+1}: ${q.q}</strong><br>
                        <span class="text-green-400">Ans: ${q.ans}</span> | <span class="text-gray-400">Hint: ${q.hint}</span>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
